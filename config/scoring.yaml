# Scoring and Fit Evaluation Configuration
# ----------------------------------------

# Thresholds
thresholds:
  min_fit_score: 55
  high_priority_fit_score: 80

# Positive Boosts
boosts:
  priority_titles:
    score: +25
    matches:
      - "Machine Learning"
      - "Machine Learning Engineer"
      - "AI Engineer"
      - "Applied AI Engineer"
      - "Software Engineer"
      - "Data Scientist"

# Penalties
penalties:
  generic_data_title_without_engineering_or_science:
    score: -50
    condition: "Title contains 'Data and Analytics' or 'Analytics' without 'Engineer' or 'Scientist' attached"
    matches:
      - "Data and Analytics"
      - "Data & Analytics"
      - "Data Analytics"

  pure_research_role:
    score: -100
    condition: "Pure academic, theoretical, or research scientist roles mismatched with applied engineering background"
    matches:
      - "Research Scientist"
      - "Machine Learning Researcher"
      - "Quantitative Researcher"
      - "Research Fellow"
      - "Postdoctoral"

  experienced_or_specialist_role:
    score: -100
    condition: "Level 2/II, Specialist, or roles requiring prior industry experience"
    matches:
      - "Specialist"
      - "Level 2"
      - "Level II"
      - "Experienced"

  non_technical_role:
    score: -100
    condition: "Role matches NON_TECH_TITLES (advisor, analyst, rotational, development program, etc.)"
